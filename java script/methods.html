<!DOCTYPE html>
<html>
    <body>
        <p id="demo"></p>
        <p id="demo1"></p>
        <p id="demo2"></p>
        <script>
        const text="java data array"
        const arr = text.split(" ");
        function checkLength(word) {
            return word.length > 3;
        }
        const result = arr.filter(checkLength);
        document.getElementById("demo").innerHTML = result.join(" ");
        function findarr(word) {
            return word.startsWith("b");
        }
        const result1 = arr.find(findarr);
        document.getElementById("demo1").innerHTML = result1;
        function letter(word){
            return word.includes("a");
        }
        const result2= arr.every(letter);
        document.getElementById("demo2").innerHTML = result2;

        </script>
    </body>
</html>
