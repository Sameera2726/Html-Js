<!DOCTYPE html>
<html>
<head>
    <title>Smart Expense Tracker</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        .container{
            width:80%;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        input,select,button{
            padding:10px;
            margin:5px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        th{
            background:black;
            color:white;
        }

        .cards{
            display:flex;
            gap:20px;
            margin-top:20px;
        }

        .card{
            flex:1;
            background:#ddd;
            padding:15px;
            border-radius:8px;
            text-align:center;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Smart Expense Tracker Dashboard</h1>

    <!-- Form -->

    <input type="text" id="title" placeholder="Expense Title">

    <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Bills</option>
    </select>

    <input type="number" id="amount" placeholder="Amount">

    <button onclick="addExpense()">Add Expense</button>

    <!-- Filter -->

    <select id="filterCategory" onchange="filterExpenses()">

        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>

    </select>

    <!-- Summary Cards -->

    <div class="cards">

        <div class="card">
            <h3>Total Expense</h3>
            <p id="totalExpense">0</p>
        </div>

        <div class="card">
            <h3>Total Transactions</h3>
            <p id="totalTransactions">0</p>
        </div>

        <div class="card">
            <h3>Highest Expense</h3>
            <p id="highestExpense">0</p>
        </div>

    </div>

    <!-- Table -->

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="expenseTable"></tbody>

    </table>

</div>

<script>

    // Objects inside Array

    let expenses = [

        {
            id:1,
            title:"Pizza",
            category:"Food",
            amount:500
        },

        {
            id:2,
            title:"Bus Ticket",
            category:"Travel",
            amount:200
        },

        {
            id:3,
            title:"Electricity Bill",
            category:"Bills",
            amount:1200
        }

    ];


    // Fake fetch() using Promise

    function fakeFetch(){
        return new Promise(function(resolve,reject){
            setTimeout(function(){
                resolve(expenses);
            },1000);
        });
    }


    // fetch() then() catch()

    fakeFetch()

    .then(function(data){

        displayExpenses(data);

        updateSummary();

    })

    .catch(function(error){

        console.log(error);

    });

    // Display Data

    function displayExpenses(data){

        const table =
        document.getElementById("expenseTable");

        table.innerHTML = "";

        data.forEach(function(expense){

            table.innerHTML += `

            <tr>

                <td>${expense.id}</td>

                <td>${expense.title}</td>

                <td>${expense.category}</td>

                <td>${expense.amount}</td>

                <td>

                    <button onclick="deleteExpense(${expense.id})">
                    Delete
                    </button>

                </td>

            </tr>
            `;
        });

    }



    // Add Expense

    function addExpense(){

        const title =
        document.getElementById("title").value;

        const category =
        document.getElementById("category").value;

        const amount =
        document.getElementById("amount").value;


        const newExpense = {

            id:expenses.length+1,

            title:title,

            category:category,

            amount:Number(amount)

        };


        expenses.push(newExpense);

        displayExpenses(expenses);

        updateSummary();

    }



    // filter()

    function filterExpenses(){

        const selected =
        document.getElementById("filterCategory").value;


        if(selected === "All"){

            displayExpenses(expenses);

        }

        else{

            const filteredData =
            expenses.filter(function(expense){

                return expense.category === selected;

            });

            displayExpenses(filteredData);

        }

    }



    // Delete Expense using filter()

    function deleteExpense(id){

        expenses = expenses.filter(function(expense){

            return expense.id !== id;

        });

        displayExpenses(expenses);

        updateSummary();

    }



    // reduce()

    function updateSummary(){


        // Total Expense

        const total = expenses.reduce(function(sum,expense){

            return sum + expense.amount;

        },0);



        // Highest Expense

        const highest = expenses.reduce(function(max,expense){

            return expense.amount > max
            ? expense.amount
            : max;

        },0);



        document.getElementById("totalExpense")
        .innerHTML = total;


        document.getElementById("totalTransactions")
        .innerHTML = expenses.length;


        document.getElementById("highestExpense")
        .innerHTML = highest;

    }



    // Rest Operator (...)

    function addMultipleExpenses(...newItems){

        expenses.push(...newItems);

        displayExpenses(expenses);

        updateSummary();

    }



    // bind()

    function generateReport(currency){

        console.log("Expense Report in " + currency);

        console.log(expenses);

    }


    const reportInRupees =
    generateReport.bind(this,"INR");


    reportInRupees();

</script>

</body>
</html>
